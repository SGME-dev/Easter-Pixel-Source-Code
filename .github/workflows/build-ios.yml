name: Build iOS (Godot 4.6)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 1 # Only gets the latest version to speed up checkout

    - name: Download Godot 4.6
      run: |
        wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_macos.universal.zip
        unzip Godot_v4.6-stable_macos.universal.zip
        sudo mv Godot.app /Applications/Godot.app
        # Link the binary so we can use the 'godot' command
        sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

    - name: Download Export Templates
      run: |
        # Godot 4.6 uses this specific directory structure on macOS
        mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.6.stable
        wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
        unzip Godot_v4.6-stable_export_templates.tpz
        mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.6.stable/

    - name: Export Xcode Project
      # Using --headless because cloud runners don't have a monitor
      run: |
        mkdir -p build/ios
        godot --headless --export-release "iOS" "build/Easter Pixel.xcodeproj"

    - name: Build Unsigned Archive
      run: |
        # We use Manual signing style to prevent 'Conflicting Settings' errors
        xcodebuild archive \
          -project "build/Easter Pixel.xcodeproj" \
          -scheme "Easter Pixel" \
          -configuration Release \
          -archivePath "build/Easter Pixel.xcarchive" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY=""

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Easter-Pixel-iOS-Build
        path: build/Easter Pixel.xcarchive