name: Build iOS (Godot 4.6)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 1 # Faster checkout for 1.7.0/1.8.0 assets

    - name: Cache Godot Editor and Templates
      uses: actions/cache@v4
      with:
        path: |
          /Applications/Godot.app
          ~/Library/Application Support/Godot/export_templates/4.6.stable
        key: ${{ runner.os }}-godot-4.6-stable

    - name: Cache .godot Import Folder
      # This stops the constant "Reimporting Daydream DEMO.otf" loop
      uses: actions/cache@v4
      with:
        path: .godot/imported/
        key: ${{ runner.os }}-godot-import-cache-${{ hashFiles('**/project.godot') }}
        restore-keys: |
          ${{ runner.os }}-godot-import-cache-

    - name: Download Godot 4.6
      run: |
        if [ ! -d "/Applications/Godot.app" ]; then
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_macos.universal.zip
          unzip Godot_v4.6-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
        fi
        sudo ln -sf /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

    - name: Download Export Templates
      run: |
        TEMPLATE_PATH=~/Library/Application\ Support/Godot/export_templates/4.6.stable
        if [ ! -d "$TEMPLATE_PATH" ]; then
          mkdir -p "$TEMPLATE_PATH"
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip Godot_v4.6-stable_export_templates.tpz
          mv templates/* "$TEMPLATE_PATH/"
        fi

    - name: Export Xcode Project
      # Headless mode handles the 1.7.0 UI assets efficiently
      run: |
        mkdir -p build/ios
        godot --headless --export-release "iOS" "build/Easter Pixel.xcodeproj"

    - name: Build Unsigned Archive
      run: |
        # Manual signing prevents "Conflicting Provisioning" errors in 4.6
        xcodebuild archive \
          -project "build/Easter Pixel.xcodeproj" \
          -scheme "Easter Pixel" \
          -configuration Release \
          -archivePath "build/Easter Pixel.xcarchive" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY=""

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Easter-Pixel-iOS-v1.8.0
        path: build/Easter Pixel.xcarchive